<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TuxDash</title>

    <link rel="stylesheet" href="newtab.css" />
  </head>

  <body>
    <!-- Google-style page controls -->
    <div class="page-controls">
      <div class="google-links" aria-label="Google links">
        <a href="https://mail.google.com/" target="_self">Gmail</a>
        <a href="https://images.google.com/" target="_self">Images</a>
      </div>

      <button
        id="appsLauncher"
        class="icon-button apps-launcher"
        type="button"
        aria-label="Open apps"
        aria-expanded="false"
        aria-controls="appsMenu"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="5" r="1.6" />
          <circle cx="12" cy="5" r="1.6" />
          <circle cx="19" cy="5" r="1.6" />
          <circle cx="5" cy="12" r="1.6" />
          <circle cx="12" cy="12" r="1.6" />
          <circle cx="19" cy="12" r="1.6" />
          <circle cx="5" cy="19" r="1.6" />
          <circle cx="12" cy="19" r="1.6" />
          <circle cx="19" cy="19" r="1.6" />
        </svg>
      </button>

      <a
        id="profileButton"
        class="profile-button"
        href="https://myaccount.google.com/"
        target="_self"
        aria-label="Open Google Account"
      >
        <img
          src="https://www.google.com/s2/favicons?domain=myaccount.google.com&sz=64"
          alt=""
        />
      </a>

      <div id="appsMenu" class="apps-menu" hidden>
        <section class="favorite-apps" aria-labelledby="favoritesTitle">
          <div class="apps-menu-heading">
            <h2 id="favoritesTitle">Your favorites</h2>
            <button class="edit-apps" type="button" aria-label="Edit favorites">
              ✎
            </button>
          </div>
          <div class="apps-grid">
            <a
              class="app-tile"
              href="https://myaccount.google.com/"
              target="_self"
              ><img
                class="app-avatar"
                src="https://www.google.com/s2/favicons?domain=myaccount.google.com&sz=64"
                alt=""
              /><span>Account</span></a
            >
            <a class="app-tile" href="https://www.google.com/" target="_self"
              ><img
                src="https://www.google.com/s2/favicons?domain=google.com&sz=64"
                alt=""
              /><span>Search</span></a
            >
            <a class="app-tile" href="https://maps.google.com/" target="_self"
              ><img
                src="https://www.google.com/s2/favicons?domain=maps.google.com&sz=64"
                alt=""
              /><span>Maps</span></a
            >
            <a class="app-tile" href="https://www.youtube.com/" target="_self"
              ><img
                src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64"
                alt=""
              /><span>YouTube</span></a
            >
            <a class="app-tile" href="https://gemini.google.com/" target="_self"
              ><img
                src="https://www.google.com/s2/favicons?domain=gemini.google.com&sz=64"
                alt=""
              /><span>Gemini</span></a
            >
            <a class="app-tile" href="https://mail.google.com/" target="_self"
              ><img
                src="https://www.google.com/s2/favicons?domain=mail.google.com&sz=64"
                alt=""
              /><span>Gmail</span></a
            >
            <a class="app-tile" href="https://meet.google.com/" target="_self"
              ><img
                src="https://www.google.com/s2/favicons?domain=meet.google.com&sz=64"
                alt=""
              /><span>Meet</span></a
            >
            <a class="app-tile" href="https://docs.google.com/" target="_self"
              ><img
                src="https://www.google.com/s2/favicons?domain=docs.google.com&sz=64"
                alt=""
              /><span>Docs</span></a
            >
            <a class="app-tile" href="https://sheets.google.com/" target="_self"
              ><img
                src="https://www.google.com/s2/favicons?domain=sheets.google.com&sz=64"
                alt=""
              /><span>Sheets</span></a
            >
          </div>
        </section>
        <div class="more-apps apps-grid">
          <a class="app-tile" href="https://drive.google.com/" target="_self"
            ><img
              src="https://www.google.com/s2/favicons?domain=drive.google.com&sz=64"
              alt=""
            /><span>Drive</span></a
          >
          <a class="app-tile" href="https://calendar.google.com/" target="_self"
            ><img
              src="https://www.google.com/s2/favicons?domain=calendar.google.com&sz=64"
              alt=""
            /><span>Calendar</span></a
          >
          <a class="app-tile" href="https://news.google.com/" target="_self"
            ><img
              src="https://www.google.com/s2/favicons?domain=news.google.com&sz=64"
              alt=""
            /><span>News</span></a
          >
          <a class="app-tile" href="https://photos.google.com/" target="_self"
            ><img
              src="https://www.google.com/s2/favicons?domain=photos.google.com&sz=64"
              alt=""
            /><span>Photos</span></a
          >
          <a
            class="app-tile"
            href="https://translate.google.com/"
            target="_self"
            ><img
              src="https://www.google.com/s2/favicons?domain=translate.google.com&sz=64"
              alt=""
            /><span>Translate</span></a
          >
          <a class="app-tile" href="https://play.google.com/" target="_self"
            ><img
              src="https://www.google.com/s2/favicons?domain=play.google.com&sz=64"
              alt=""
            /><span>Play</span></a
          >
        </div>
      </div>
    </div>

    <!-- Clock -->
    <div class="clock">
      <div id="time">00:00</div>
      <div id="date">Loading...</div>
    </div>

    <main class="dashboard">
      <div class="overlay">
        <h1>TuxDash</h1>

        <!-- Search -->
        <form
          class="search-form"
          action="https://www.google.com/search"
          method="get"
          target="_self"
        >
          <input
            type="search"
            name="q"
            placeholder="Search the web..."
            aria-label="Search the web"
            autocomplete="off"
          />
        </form>

        <!-- Quick Links -->
        <nav class="quick-links" aria-label="Quick links">
          <a
            href="https://mail.google.com/"
            target="_self"
            rel="noopener noreferrer"
          >
            Gmail
          </a>

          <a
            href="https://airtable.com/appewCqs3JTN558FC?ao=cmVjZW50"
            target="_self"
            rel="noopener noreferrer"
          >
            Airtable
          </a>

          <a
            href="https://app.slack.com/client/T04JURZBFQC/"
            target="_self"
            rel="noopener noreferrer"
          >
            Slack
          </a>

          <a
            href="https://chatgpt.com/"
            target="_self"
            rel="noopener noreferrer"
          >
            Chatgpt
          </a>
        </nav>

        <!-- Wallpaper Controls -->
        <div class="wallpaper-controls">
          <button
            id="previousWallpaper"
            type="button"
            aria-label="Previous wallpaper"
          >
            ←
          </button>

          <span id="wallpaperCounter">1 / 1</span>

          <button id="nextWallpaper" type="button" aria-label="Next wallpaper">
            →
          </button>

          <button
            id="favoriteWallpaper"
            class="favorite-button"
            type="button"
            aria-label="Favorite wallpaper"
            aria-pressed="false"
          >
            ♡
          </button>
        </div>

        <div class="theme-credit">
          Made By
          <a href="https://vishwajeetsinghshrinet.github.io/portfolio/"
            >Vishwajeet Singh</a
          >
        </div>
      </div>
    </main>

    <script src="newtab.js"></script>
  </body>
</html>
